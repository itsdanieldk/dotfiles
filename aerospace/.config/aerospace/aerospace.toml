# ============================================================
# AeroSpace — tiling window manager
# ============================================================
# Docs:     https://nikitabobko.github.io/AeroSpace/guide
# Commands: https://nikitabobko.github.io/AeroSpace/commands
#
# AeroSpace reads either ~/.aerospace.toml or this XDG path. Having BOTH is an
# error ("ambiguity is reported"), so ~/.aerospace.toml must not exist.
config-version = 2


# ============================================================
# Startup
# ============================================================
# What AeroSpace runs at launch and how it reloads this file.
#
# The escape hatch is `aerospace enable toggle`, which suspends window management
# without quitting — so there's no reason to keep launching it by hand.
start-at-login = true

# Re-reads this file on save. Per upstream, reload once by hand after enabling
# for the auto-reloading to start.
auto-reload-config = true

# JankyBorders — draws the focus ring (see the focus cues under Behaviour).
# Run with no arguments so it reads ~/.config/borders/bordersrc, which is the
# stowed `borders` package. Started from here rather than `brew services` so the
# ring's lifetime is tied to the window manager's: quit AeroSpace, no orphan.
after-startup-command = [
    'exec-and-forget borders',
    'exec-and-forget sketchybar',
]
on-mode-changed = []


# ============================================================
# Layout
# ============================================================
# How windows are arranged by default and the gaps left around them.

# New windows tile rather than float or stack.
default-root-container-layout = 'tiles'

# 'auto' = horizontal on wide monitors, vertical on tall ones
default-root-container-orientation = 'auto'
accordion-padding = 30

# Keep the tree tidy as windows come and go: flatten drops containers left
# holding a single child, and opposite-orientation makes a nested container split
# the other way from its parent so new windows land predictably.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# 8 to match kitty's window_padding_width
gaps.inner.horizontal = 8
gaps.inner.vertical   = 8
gaps.outer.left       = 8
gaps.outer.bottom     = 8
# 43 = SketchyBar's height (38, set in sketchybarrc) + 5pt clearance. These two
# numbers are coupled: raise the bar and windows tuck underneath it, lower the
# bar and a band of wallpaper opens above them.
gaps.outer.top        = 43
gaps.outer.right      = 8


# ============================================================
# Behaviour
# ============================================================
# Focus feedback, the bridge that keeps SketchyBar in sync, and a few
# interaction defaults.
#
# Focus cue. AeroSpace can't animate a window move (see the note at the top), so
# the JankyBorders ring flashes lavender for ~120ms and settles back to mauve.
# Re-invoking `borders` reconfigures the running instance rather than starting a
# second one, which is what makes the two-frame pulse work.
# Colours are Catppuccin Frappé: lavender #babbf1, mauve #ca9ee6 (the same mauve
# kitty uses for active_tab_background). They must stay in sync with bordersrc.
# If a held-down alt-h/alt-l ever makes the pulse look like flicker, drop this
# callback — the static ring survives on its own.
on-focus-changed = [
    'exec-and-forget /bin/sh -c "borders active_color=0xffbabbf1; sleep 0.12; borders active_color=0xffca9ee6"',
]

# Pushes workspace switches to SketchyBar, which has no way to learn about them
# on its own. Inert while sketchybar isn't running — the command just fails into
# the void — which is why it's safe to leave here while the bar is still being
# trialled. $AEROSPACE_FOCUSED_WORKSPACE is set by AeroSpace for this callback.
exec-on-workspace-change = [
    '/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]
# Focus only on keypress (not on hover), leave macOS-hidden apps hidden, and
# read the keyboard as QWERTY regardless of the active layout.
focus-follows-mouse.enabled = false
automatically-unhide-macos-hidden-apps = false
key-mapping.preset = 'qwerty'

# Numeric only — kept in sync with the bindings below.
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]


# ============================================================
# Window rules
# ============================================================
# Runs every time a new window is detected. Two syntaxes exist; this is the
# current one (`if = 'test ...'`). The `if.app-id = '...'` form seen in most
# blog posts is the deprecated legacy spelling.
#
# `check-further-callbacks` defaults to false, so the FIRST matching rule wins
# and everything below it is skipped. The rules here are mutually exclusive, so
# order doesn't bite yet — it will the moment two conditions can both match.
#
# Bundle IDs were read off each app's Info.plist, not guessed. To add one:
# `aerospace list-apps` while it's running.
#
on-window-detected = [
    # Float — utilities and preference panes; a tile only distorts the layout.
    { if = 'test %{app-bundle-id} = com.apple.systempreferences',          run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.apple.calculator',                 run = 'layout floating' },
    { if = 'test %{app-bundle-id} = app.monitorcontrol.MonitorControl',    run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.logi.optionsplus',                 run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.crystalidea.macsfancontrol',       run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.focusrite.control',                run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.titanium.OnyX',                    run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.jetbrains.toolbox',                run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.raycast.macos',                    run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.codeweavers.CrossOver',            run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.valvesoftware.steam',              run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.microsoft.teams2',  run = 'move-node-to-workspace 6' },
    { if = 'test %{app-bundle-id} = com.microsoft.Outlook', run = 'move-node-to-workspace 7' },
    { if = 'test %{app-bundle-id} = md.obsidian',           run = 'move-node-to-workspace 8' },
]


# ============================================================
# Main bindings
# ============================================================
# Everyday window management, all on the `alt` modifier. Note that every
# alt-<letter> here also shadows a zsh line-editor widget (^[b/^[f word motion,
# ^[d kill-word, …), so check `bindkey -M emacs` before adding a new one — see
# CLAUDE.md.
[mode.main.binding]

    # Launch a terminal, then focus by direction. Focus wraps at the screen edge
    # (cheap to undo), unlike the moves further down which deliberately stop.
    alt-shift-enter = 'exec-and-forget open -na kitty'

    alt-h = 'focus --wrap-around left'
    alt-j = 'focus --wrap-around down'
    alt-k = 'focus --wrap-around up'
    alt-l = 'focus --wrap-around right'

    # Move the focused window. NOT --wrap-around, deliberately: wrapping a MOVE
    # reorders the tree and is awkward to undo, whereas a focus that wraps costs
    # nothing. A move that stops at the edge is the safe default.
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # Resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # Layout
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    # ctrl, NOT upstream's alt — do not "fix" this back. On the Danish layout
    # `[ ] { } \` live on the Option layer of the digit row (alt-8, alt-9,
    # alt-shift-7/8/9) with no other route to them, so binding alt-<digit> makes
    # those characters untypable system-wide, in every app. Measured with
    # UCKeyTranslate: ctrl-8 gives 8, but cmd-alt-8 still gives [ — cmd is not an
    # escape hatch. Same trap on Norwegian, Swedish, Finnish and German.
    ctrl-1 = 'workspace 1'
    ctrl-2 = 'workspace 2'
    ctrl-3 = 'workspace 3'
    ctrl-4 = 'workspace 4'
    ctrl-5 = 'workspace 5'
    ctrl-6 = 'workspace 6'
    ctrl-7 = 'workspace 7'
    ctrl-8 = 'workspace 8'
    ctrl-9 = 'workspace 9'

    # Send the focused window to a workspace. ctrl-shift, matching the switch
    # bindings above — alt-shift-7/8/9 are \ { } on this layout.
    ctrl-shift-1 = 'move-node-to-workspace 1'
    ctrl-shift-2 = 'move-node-to-workspace 2'
    ctrl-shift-3 = 'move-node-to-workspace 3'
    ctrl-shift-4 = 'move-node-to-workspace 4'
    ctrl-shift-5 = 'move-node-to-workspace 5'
    ctrl-shift-6 = 'move-node-to-workspace 6'
    ctrl-shift-7 = 'move-node-to-workspace 7'
    ctrl-shift-8 = 'move-node-to-workspace 8'
    ctrl-shift-9 = 'move-node-to-workspace 9'

    alt-tab = 'workspace-back-and-forth'
    # Window-level counterpart to alt-tab. ^[` is unbound in emacs mode.
    alt-backtick = 'focus-back-and-forth'

    # alt-shift-tab (focus-monitor) and alt-ctrl-shift-h/l (move-node-to-monitor)
    # lived here and are gone with the second screen. That hands ^[^H
    # (backward-kill-word) and ^[^L (clear-screen) back to the shell, and leaves
    # three easy chords free if something else wants them.

    alt-shift-semicolon = ['mode service', 'exec-and-forget sketchybar --set aerospace_mode drawing=on']


# ============================================================
# Service mode
# ============================================================
# Entered with alt-shift-semicolon; every binding returns to main mode.
#
# THE SERVICE PILL. Entering the mode shows a "SERVICE" pill (island.mode in
# sketchybarrc); the trailing `… drawing=off` on every binding hides it again on the
# way back to main. This is manual on purpose: on-mode-changed carries no mode name
# (AeroSpace issue #390 — `aerospace list-exec-env-vars` shows no AEROSPACE_MODE), so
# no single callback can tell the bar "service" from "main". CONSEQUENCE: a NEW binding
# added here MUST carry the same hide, or the pill sticks on SERVICE after that key.
# Harmless while sketchybar isn't running — the --set just fails into the void.
[mode.service.binding]
    esc       = ['reload-config',                 'mode main', 'exec-and-forget sketchybar --set aerospace_mode drawing=off']  # exit + reload
    r         = ['flatten-workspace-tree',        'mode main', 'exec-and-forget sketchybar --set aerospace_mode drawing=off']  # reset layout
    f         = ['layout floating tiling',        'mode main', 'exec-and-forget sketchybar --set aerospace_mode drawing=off']  # toggle float/tile
    m         = ['fullscreen',                    'mode main', 'exec-and-forget sketchybar --set aerospace_mode drawing=off']  # toggle fullscreen
    b         = ['balance-sizes',                 'mode main', 'exec-and-forget sketchybar --set aerospace_mode drawing=off']  # equalise windows
    s         = ['swap --swap-focus dfs-next',    'mode main', 'exec-and-forget sketchybar --set aerospace_mode drawing=off']  # swap with next
    backspace = ['close-all-windows-but-current', 'mode main', 'exec-and-forget sketchybar --set aerospace_mode drawing=off']  # close others

    alt-shift-h = ['join-with left',  'mode main', 'exec-and-forget sketchybar --set aerospace_mode drawing=off']
    alt-shift-j = ['join-with down',  'mode main', 'exec-and-forget sketchybar --set aerospace_mode drawing=off']
    alt-shift-k = ['join-with up',    'mode main', 'exec-and-forget sketchybar --set aerospace_mode drawing=off']
    alt-shift-l = ['join-with right', 'mode main', 'exec-and-forget sketchybar --set aerospace_mode drawing=off']
