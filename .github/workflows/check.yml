name: check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans the whole history
          persist-credentials: false  # third-party steps below needn't see the token

      - name: Install zsh
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh

      # zsh syntax, Brewfile lines and duplicates, JSON/YAML/TOML parsing, shellcheck; gitleaks runs in its own step.
      - name: Repo checks
        run: zsh .githooks/checks.zsh

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667  # 1.7.12
        with:
          args: -color
